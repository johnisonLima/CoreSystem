<mat-toolbar color="primary">
  <span class="title">Usuários</span>
</mat-toolbar>

<div class="mat-elevation-z8">
  <app-usuarios-list
    *ngIf="usuarios$ | async as usuarios; else loading" [usuarios]="usuarios"
    (add)="onAdd()"
    (edit)="onEdit($event)"
    (remove)="onRemove($event)">
  </app-usuarios-list>

  <mat-card>

    <ng-template #loading>
      <div class="loading-spinner">
        <mat-spinner></mat-spinner>
      </div>
    </ng-template>

  </mat-card>
</div>
