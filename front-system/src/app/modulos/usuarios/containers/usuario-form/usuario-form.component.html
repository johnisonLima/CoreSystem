<div class="envelope">
  <mat-card class="card">
    <mat-card-content>
      <form [formGroup]="formulario">

        <div class="form-row">
          <mat-form-field class="col-4">
            <mat-label>Nome</mat-label>
            <input matInput placeholder="Nome" formControlName="nome">
          </mat-form-field>

          <mat-form-field class="col-8">
            <mat-label>Sobrenome</mat-label>
            <input matInput placeholder="Sobrenome" formControlName="sobrenome">
          </mat-form-field>
        </div>

        <div class="form-row">
          <mat-form-field class="col-5">
            <mat-label>E-mail</mat-label>
            <input matInput placeholder="E-mail" formControlName="email">
          </mat-form-field>

          <mat-form-field >
            <mat-label>Status</mat-label>
            <mat-select formControlName="status">
              <mat-option *ngFor="let status of statusTypes" [value]="status">{{ status }}</mat-option>
            </mat-select>
          </mat-form-field>
        </div>

        <div formGroupName="endereco">
          <div class="form-row">
            <mat-form-field class="col-3">
              <mat-label>CEP</mat-label>
              <input matInput placeholder="00000-000" #cep formControlName="cep" maxlength="10">
            </mat-form-field>

            <mat-form-field class="col-3">
              <mat-label>Estado</mat-label>
              <input matInput placeholder="Estado" formControlName="estado">
            </mat-form-field>

            <mat-form-field class="col-5">
              <mat-label>Cidade</mat-label>
              <input matInput placeholder="Cidade" formControlName="cidade">
            </mat-form-field>
          </div>
          <div class="form-row">
            <mat-form-field class="col-5">
              <mat-label>Bairro</mat-label>
              <input matInput placeholder="Bairro" formControlName="bairro">
            </mat-form-field>

            <mat-form-field class="col-2">
              <mat-label>Número</mat-label>
              <input matInput placeholder="Número" formControlName="numero">
            </mat-form-field>

            <mat-form-field class="col-5">
              <mat-label>Complemento</mat-label>
              <input matInput placeholder="Complemento" formControlName="complemento">
            </mat-form-field>

          </div>
          <div class="form-row">
            <mat-form-field class="col-8">
              <mat-label>Logradouro</mat-label>
              <input matInput placeholder="Logradouro" formControlName="logradouro">
            </mat-form-field>

          </div>
        </div>

        <div class="d-flex align-items-baseline" formArrayName="telefones">
          <div class="wrap-phone col-10">
            <div *ngFor="let telefone of telefones.controls; let i=index" [formGroupName]="i">
              <div class="form-row align-items-baseline">
                <mat-form-field class="col-10">
                  <mat-label>Número Telefone</mat-label>
                  <input matInput placeholder="Número Telefone" formControlName="numero">
                </mat-form-field>

                <mat-form-field >
                  <mat-label>Tipo</mat-label>
                  <mat-select formControlName="tipo">
                    <mat-option *ngFor="let type of phoneTypes" [value]="type">{{ type }}</mat-option>
                  </mat-select>
                </mat-form-field>

                <div class="col-2">
                  <button mat-icon-button color="primary" aria-label="Adicionar Telefone"
                    (click)="removeTelefone(i)">
                    <mat-icon>close_small</mat-icon>
                  </button>
                </div>
              </div>
            </div>
          </div>
          <div class="d-flex col-2">
            <button mat-icon-button color="primary" aria-label="Adicionar Telefone"
              (click)="addTelefone()">
              <mat-icon>add_call</mat-icon>
            </button>
          </div>
        </div>

        <div class="form-row">
          <mat-form-field class="col">
            <mat-label>Senha</mat-label>
            <input matInput placeholder="Senha" formControlName="senha">

          </mat-form-field>

          <mat-form-field class="col">
            <mat-label>Repetir senha</mat-label>
            <input matInput placeholder="Repetir senha" formControlName="senhaRepetir">

          </mat-form-field>
        </div>
      </form>
    </mat-card-content>

    <mat-card-actions class="actions">
      <button mat-stroked-button type="reset" color="warn" (click)="onCancel()">Cancelar</button>
      <button mat-raised-button type="submit" color="primary" (click)="onSubmit()">Salvar</button>
    </mat-card-actions>
  </mat-card>

  <app-form-debug [form]="formulario"></app-form-debug>
</div>
